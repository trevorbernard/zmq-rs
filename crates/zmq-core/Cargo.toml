[package]
name = "zmq-core"
description = "ZeroMQ engine: I/O threads, transports, sessions and socket patterns"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Routing for libzmq's draft socket types. Enabled by `zmq/draft`.
draft = []

[dependencies]
atomic-waker.workspace = true
bytes.workspace = true
if-addrs.workspace = true
mio.workspace = true
socket2.workspace = true
zmtp.workspace = true
zmq-pipe.workspace = true

[target.'cfg(unix)'.dependencies]
# EINPROGRESS, to tell a non-blocking connect under way from a failure.
libc.workspace = true

[dev-dependencies]
criterion.workspace = true
proptest.workspace = true

[lints]
workspace = true

[[bench]]
name = "fanout"
harness = false

[[bench]]
name = "fairqueue"
harness = false

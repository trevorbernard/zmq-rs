[package]
name = "zmq"
description = "Idiomatic, type-safe ZeroMQ for Rust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# libzmq's draft socket types (CLIENT, SERVER, and later RADIO, DISH,
# SCATTER, GATHER, PEER and CHANNEL), as its --enable-drafts. Their RFCs
# are drafts, so their API may change.
draft = ["zmq-core/draft"]

[dependencies]
zmq-core.workspace = true
zmq-pipe.workspace = true
zmtp.workspace = true

[dev-dependencies]
proptest.workspace = true
zmq-test-ports.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
# setrlimit, to run a listener out of file descriptors in a test.
libc.workspace = true

[lints]
workspace = true

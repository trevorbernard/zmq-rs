<svg xmlns="http://www.w3.org/2000/svg" width="860" height="212" viewBox="0 0 860 212" role="img" aria-label="PUB fan-out: libzmq walks a multi-trie and partitions the dist_t array; zmq-rs hashes each prefix length some topic has and looks up subscribed peers." font-family="IBM Plex Sans, system-ui, sans-serif"><rect width="100%" height="100%" fill="#ffffff"/><style>text{fill:#1b2230}

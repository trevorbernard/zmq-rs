<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="420" viewBox="0 0 1020 420" role="img" aria-label="Side by side thread topology: libzmq routes wakeups through command mailboxes and has a reaper thread, zmq-rs routes them through Wakers and has no reaper."><rect width="100%" height="100%" fill="#ffffff"/><style>text{fill:#1b2230}
text { fill: #1b2230; }
.muted, .num { fill: #5a6476; }
.lbl { paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
.t-cpp { fill: #0f7c86; } .t-rs { fill: #b4501c; }
.on-accent { fill: #ffffff; }
.fill-fg { fill: #1b2230; } .fill-cpp { fill: #0f7c86; } .fill-rs { fill: #b4501c; }
.ln-fg { stroke: #1b2230; stroke-width: 1.4; fill: none; }
.ln-cpp { stroke: #0f7c86; stroke-width: 1.6; } .ln-rs { stroke: #b4501c; stroke-width: 1.6; }
.dash { stroke-dasharray: 5 4; }
.life { stroke: #d9dee6; stroke-width: 1.2; stroke-dasharray: 3 4; }
.head-cpp { fill: #e3f3f4; stroke: #0f7c86; }
.head-rs { fill: #fbece4; stroke: #b4501c; }
.grp-cpp { fill: #e3f3f4; fill-opacity: .45; stroke: #0f7c86; stroke-dasharray: 4 3; }
.grp-rs { fill: #fbece4; fill-opacity: .45; stroke: #b4501c; stroke-dasharray: 4 3; }
.box { fill: #ffffff; stroke: #1b2230; }
.diamond { fill: #ffffff; stroke: #1b2230; stroke-width: 2; }
.good { fill: #e5f3ea; stroke: #2f7d4a; }
.bad { fill: #f8e4e5; stroke: #b0303a; }</style>
    <defs>
      <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker>
    </defs>
    <g font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12" fill="currentColor">
      <!-- libzmq panel -->
      <text x="10" y="20" font-size="14" font-weight="600" style="fill:#0f7c86">libzmq</text>
      <rect x="10" y="36" width="190" height="304" rx="6" fill="none" stroke-width="1.5" style="stroke:#d9dee6"/>
      <text x="20" y="54" font-size="11" style="fill:#5a6476">APP THREAD</text>
      <rect x="290" y="36" width="200" height="304" rx="6" fill="none" stroke-width="1.5" style="stroke:#d9dee6"/>
      <text x="300" y="54" font-size="11" style="fill:#5a6476">I/O THREAD (io_thread_t)</text>

      <rect x="25" y="70" width="160" height="56" rx="4" style="fill:#e3f3f4;stroke:#0f7c86"/>
      <text x="105" y="94" text-anchor="middle" font-family="IBM Plex Mono, monospace">socket_base_t</text>
      <text x="105" y="112" text-anchor="middle" font-size="11" style="fill:#5a6476">virtual xsend / xrecv</text>
      <rect x="25" y="146" width="160" height="44" rx="4" stroke="currentColor" style="fill:#ffffff"/>
      <text x="105" y="173" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11">lb_t · fq_t · dist_t</text>
      <line x1="105" y1="126" x2="105" y2="146" stroke="currentColor" marker-end="url(#ah)"/>
      <rect x="25" y="290" width="160" height="36" rx="4" stroke="currentColor" style="fill:#ffffff"/>
      <text x="105" y="313" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11">mailbox_t + signaler fd</text>

      <rect x="305" y="70" width="170" height="36" rx="4" stroke="currentColor" style="fill:#ffffff"/>
      <text x="390" y="93" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11">poller (epoll/kqueue)</text>
      <rect x="305" y="150" width="170" height="36" rx="4" style="fill:#e3f3f4;stroke:#0f7c86"/>
      <text x="390" y="173" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11">session_base_t</text>
      <rect x="305" y="198" width="170" height="36" rx="4" stroke="currentColor" style="fill:#ffffff"/>
      <text x="390" y="221" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11">zmtp_engine + v2 codec</text>
      <rect x="305" y="244" width="170" height="30" rx="4" fill="none" stroke="currentColor" stroke-dasharray="2 3"/>
      <text x="390" y="264" text-anchor="middle" font-size="11">TCP fd</text>
      <rect x="305" y="290" width="170" height="36" rx="4" stroke="currentColor" style="fill:#ffffff"/>
      <text x="390" y="313" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11">mailbox_t + signaler fd</text>
      <line x1="390" y1="186" x2="390" y2="198" stroke="currentColor"/>
      <line x1="390" y1="234" x2="390" y2="244" stroke="currentColor"/>

      <line x1="185" y1="160" x2="303" y2="160" stroke-width="2" marker-end="url(#ah)" style="stroke:#0f7c86"/>
      <line x1="303" y1="178" x2="187" y2="178" stroke-width="2" marker-end="url(#ah)" style="stroke:#0f7c86"/>
      <text x="245" y="152" text-anchor="middle" font-size="11">pipe_t frames</text>
      <text x="245" y="196" text-anchor="middle" font-size="11" style="fill:#5a6476">msg_t + MORE</text>

      <line x1="185" y1="300" x2="303" y2="300" stroke="currentColor" stroke-dasharray="5 4" marker-end="url(#ah)"/>
      <line x1="303" y1="316" x2="187" y2="316" stroke="currentColor" stroke-dasharray="5 4" marker-end="url(#ah)"/>
      <text x="245" y="286" text-anchor="middle" font-size="11">command_t</text>
      <text x="245" y="334" text-anchor="middle" font-size="10" style="fill:#5a6476">activate_read/write, term…</text>

      <rect x="10" y="356" width="480" height="40" rx="6" fill="none" stroke-dasharray="5 4" style="stroke:#0f7c86"/>
      <text x="250" y="381" text-anchor="middle" font-size="12">reaper thread: owns closed sockets until term / term_ack handshakes finish</text>

      <!-- divider -->
      <line x1="510" y1="20" x2="510" y2="400" style="stroke:#d9dee6"/>

      <!-- zmq-rs panel -->
      <g transform="translate(520,0)">
      <text x="10" y="20" font-size="14" font-weight="600" style="fill:#b4501c">zmq-rs</text>
      <rect x="10" y="36" width="190" height="304" rx="6" fill="none" stroke-width="1.5" style="stroke:#d9dee6"/>
      <text x="20" y="54" font-size="11" style="fill:#5a6476">USER THREAD / TASK</text>
      <rect x="290" y="36" width="200" height="304" rx="6" fill="none" stroke-width="1.5" style="stroke:#d9dee6"/>
      <text x="300" y="54" font-size="11" style="fill:#5a6476">I/O THREAD (EventLoop)</text>

      <rect x="25" y="70" width="160" height="56" rx="4" style="fill:#fbece4;stroke:#b4501c"/>
      <text x="105" y="94" text-anchor="middle" font-family="IBM Plex Mono, monospace">Socket&lt;T&gt;</text>
      <text x="105" y="112" text-anchor="middle" font-size="11" style="fill:#5a6476">methods per type</text>
      <rect x="25" y="146" width="160" height="44" rx="4" stroke="currentColor" style="fill:#ffffff"/>
      <text x="105" y="165" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11">Peers +</text>
      <text x="105" y="181" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10">LB · FQ · Router · Pub</text>
      <line x1="105" y1="126" x2="105" y2="146" stroke="currentColor" marker-end="url(#ah)"/>
      <rect x="25" y="290" width="160" height="36" rx="4" fill="none" stroke="currentColor" stroke-dasharray="2 3"/>
      <text x="105" y="313" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11">park() / async Waker</text>

      <rect x="305" y="70" width="170" height="36" rx="4" stroke="currentColor" style="fill:#ffffff"/>
      <text x="390" y="93" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11">mio::Poll (edge)</text>
      <rect x="305" y="150" width="170" height="36" rx="4" style="fill:#fbece4;stroke:#b4501c"/>
      <text x="390" y="173" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11">Session</text>
      <rect x="305" y="198" width="170" height="36" rx="4" stroke="currentColor" style="fill:#ffffff"/>
      <text x="390" y="221" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11">Engine → zmtp (sans-IO)</text>
      <rect x="305" y="244" width="170" height="30" rx="4" fill="none" stroke="currentColor" stroke-dasharray="2 3"/>
      <text x="390" y="264" text-anchor="middle" font-size="11">Stream (TCP / UDS)</text>
      <rect x="305" y="290" width="170" height="36" rx="4" stroke="currentColor" style="fill:#ffffff"/>
      <text x="390" y="306" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11">ready: mpsc&lt;id&gt;</text>
      <text x="390" y="320" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10" style="fill:#5a6476">+ mio::Waker</text>
      <line x1="390" y1="186" x2="390" y2="198" stroke="currentColor"/>
      <line x1="390" y1="234" x2="390" y2="244" stroke="currentColor"/>

      <line x1="185" y1="160" x2="303" y2="160" stroke-width="2" marker-end="url(#ah)" style="stroke:#b4501c"/>
      <line x1="303" y1="178" x2="187" y2="178" stroke-width="2" marker-end="url(#ah)" style="stroke:#b4501c"/>
      <text x="245" y="152" text-anchor="middle" font-size="11">Writer/Reader</text>
      <text x="245" y="196" text-anchor="middle" font-size="11" style="fill:#5a6476">whole Message</text>

      <line x1="185" y1="300" x2="303" y2="300" stroke="currentColor" stroke-dasharray="5 4" marker-end="url(#ah)"/>
      <line x1="303" y1="316" x2="187" y2="316" stroke="currentColor" stroke-dasharray="5 4" marker-end="url(#ah)"/>
      <text x="245" y="286" text-anchor="middle" font-size="11">TokenWaker</text>
      <text x="245" y="334" text-anchor="middle" font-size="10" style="fill:#5a6476">thread unpark</text>

      <rect x="10" y="356" width="480" height="40" rx="6" fill="none" stroke-dasharray="5 4" style="stroke:#b4501c"/>
      <text x="250" y="381" text-anchor="middle" font-size="12">no reaper: Drop closes pipes, linger runs inside the Session</text>
      </g>
    </g>
  </svg>
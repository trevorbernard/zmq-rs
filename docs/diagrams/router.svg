<svg xmlns="http://www.w3.org/2000/svg" width="900" height="444" viewBox="0 0 900 444" role="img" aria-label="ROUTER send in libzmq drops unknown or full destinations unless MANDATORY; zmq-rs always hands the message back." font-family="IBM Plex Sans, system-ui, sans-serif"><rect width="100%" height="100%" fill="#ffffff"/><style>text{fill:#1b2230}
text { fill: #1b2230; }
.muted, .num { fill: #5a6476; }
.lbl { paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
.t-cpp { fill: #0f7c86; } .t-rs { fill: #b4501c; }
.on-accent { fill: #ffffff; }
.fill-fg { fill: #1b2230; } .fill-cpp { fill: #0f7c86; } .fill-rs { fill: #b4501c; }
.ln-fg { stroke: #1b2230; stroke-width: 1.4; fill: none; }
.ln-cpp { stroke: #0f7c86; stroke-width: 1.6; } .ln-rs { stroke: #b4501c; stroke-width: 1.6; }
.dash { stroke-dasharray: 5 4; }
.life { stroke: #d9dee6; stroke-width: 1.2; stroke-dasharray: 3 4; }
.head-cpp { fill: #e3f3f4; stroke: #0f7c86; }
.head-rs { fill: #fbece4; stroke: #b4501c; }
.grp-cpp { fill: #e3f3f4; fill-opacity: .45; stroke: #0f7c86; stroke-dasharray: 4 3; }
.grp-rs { fill: #fbece4; fill-opacity: .45; stroke: #b4501c; stroke-dasharray: 4 3; }
.box { fill: #ffffff; stroke: #1b2230; }
.diamond { fill: #ffffff; stroke: #1b2230; stroke-width: 2; }
.good { fill: #e5f3ea; stroke: #2f7d4a; }
.bad { fill: #f8e4e5; stroke: #b0303a; }</style><defs>
<marker id="ro-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fill-fg"/></marker>
<marker id="ro-w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fill-rs"/></marker>
</defs><text x="20" y="18" text-anchor="start" font-size="13" font-weight="600" class="t-cpp">libzmq router_t</text>
<rect x="20" y="88" width="170" height="52" rx="4" class="head-cpp"/>
<text x="105" y="110" text-anchor="middle" font-size="11" font-family="IBM Plex Mono, ui-monospace, monospace">frame 1 =</text>
<text x="105" y="125" text-anchor="middle" font-size="11" font-family="IBM Plex Mono, ui-monospace, monospace">routing id</text>
<rect x="224" y="88" width="170" height="52" rx="4" class="diamond"/>
<text x="309" y="110" text-anchor="middle" font-size="11" font-family="IBM Plex Mono, ui-monospace, monospace">lookup</text>
<text x="309" y="125" text-anchor="middle" font-size="11" font-family="IBM Plex Mono, ui-monospace, monospace">_out_pipes map</text>
<line x1="192" y1="114" x2="222" y2="114" class="ln-fg" marker-end="url(#ro-a)"/>
<rect x="544" y="30" width="330" height="52" rx="4" class="good"/>
<text x="709" y="52" text-anchor="middle" font-size="12">set current_out,</text>
<text x="709" y="68" text-anchor="middle" font-size="12">write the following frames</text>
<path d="M396,114 C464,114 464,56 541,56" fill="none" class="ln-fg" marker-end="url(#ro-a)"/>
<text x="536" y="50" text-anchor="end" font-size="11" class="lbl">found, room</text>
<rect x="544" y="88" width="330" height="52" rx="4" class="bad"/>
<text x="709" y="110" text-anchor="middle" font-size="12">drop silently</text>
<text x="709" y="126" text-anchor="middle" font-size="12">(EHOSTUNREACH if MANDATORY)</text>
<path d="M396,114 C464,114 464,114 541,114" fill="none" class="ln-fg" marker-end="url(#ro-a)"/>
<text x="536" y="108" text-anchor="end" font-size="11" class="lbl">unknown id</text>
<rect x="544" y="146" width="330" height="52" rx="4" class="bad"/>
<text x="709" y="168" text-anchor="middle" font-size="12">drop</text>
<text x="709" y="184" text-anchor="middle" font-size="12">(EAGAIN if MANDATORY)</text>
<path d="M396,114 C464,114 464,172 541,172" fill="none" class="ln-fg" marker-end="url(#ro-a)"/>
<text x="536" y="166" text-anchor="end" font-size="11" class="lbl">pipe full</text>
<text x="20" y="238" text-anchor="start" font-size="13" font-weight="600" class="t-rs">zmq-rs RouterTable</text>
<rect x="20" y="308" width="170" height="52" rx="4" class="head-rs"/>
<text x="105" y="330" text-anchor="middle" font-size="11" font-family="IBM Plex Mono, ui-monospace, monospace">routing id +</text>
<text x="105" y="345" text-anchor="middle" font-size="11" font-family="IBM Plex Mono, ui-monospace, monospace">whole Message</text>
<rect x="224" y="308" width="170" height="52" rx="4" class="diamond"/>
<text x="309" y="330" text-anchor="middle" font-size="11" font-family="IBM Plex Mono, ui-monospace, monospace">by_identity</text>
<text x="309" y="345" text-anchor="middle" font-size="11" font-family="IBM Plex Mono, ui-monospace, monospace">HashMap → PeerKey</text>
<line x1="192" y1="334" x2="222" y2="334" class="ln-fg" marker-end="url(#ro-a)"/>
<rect x="544" y="250" width="330" height="52" rx="4" class="good"/>
<text x="709" y="272" text-anchor="middle" font-size="12">binary search PeerList,</text>
<text x="709" y="288" text-anchor="middle" font-size="12">try_send whole Message</text>
<path d="M396,334 C464,334 464,276 541,276" fill="none" class="ln-fg" marker-end="url(#ro-a)"/>
<text x="536" y="270" text-anchor="end" font-size="11" class="lbl">found, room</text>
<rect x="544" y="308" width="330" height="52" rx="4" class="bad"/>
<text x="709" y="330" text-anchor="middle" font-size="12">hand the Message back</text>
<text x="709" y="346" text-anchor="middle" font-size="12">(always MANDATORY)</text>
<path d="M396,334 C464,334 464,334 541,334" fill="none" class="ln-fg" marker-end="url(#ro-a)"/>
<text x="536" y="328" text-anchor="end" font-size="11" class="lbl">unknown id</text>
<rect x="544" y="366" width="330" height="52" rx="4" class="box"/>
<text x="709" y="388" text-anchor="middle" font-size="12">try_send hands back,</text>
<text x="709" y="404" text-anchor="middle" font-size="12">send waits for room</text>
<path d="M396,334 C464,334 464,392 541,392" fill="none" class="ln-fg" marker-end="url(#ro-a)"/>
<text x="536" y="386" text-anchor="end" font-size="11" class="lbl">peer full</text></svg>
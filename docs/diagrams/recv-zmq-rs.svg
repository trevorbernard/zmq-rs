<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="552" viewBox="0 0 1000 552" role="img" aria-label="zmq-rs receive: the engine decodes a whole message into the pipe; if the pipe is full it stops reading and the pipe&#x27;s writer waker resumes it, since mio will not signal again." font-family="IBM Plex Sans, system-ui, sans-serif"><rect width="100%" height="100%" fill="#ffffff"/><style>text{fill:#1b2230}
text { fill: #1b2230; }
.muted, .num { fill: #5a6476; }
.lbl { paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
.t-cpp { fill: #0f7c86; } .t-rs { fill: #b4501c; }
.on-accent { fill: #ffffff; }
.fill-fg { fill: #1b2230; } .fill-cpp { fill: #0f7c86; } .fill-rs { fill: #b4501c; }
.ln-fg { stroke: #1b2230; stroke-width: 1.4; fill: none; }
.ln-cpp { stroke: #0f7c86; stroke-width: 1.6; } .ln-rs { stroke: #b4501c; stroke-width: 1.6; }
.dash { stroke-dasharray: 5 4; }
.life { stroke: #d9dee6; stroke-width: 1.2; stroke-dasharray: 3 4; }
.head-cpp { fill: #e3f3f4; stroke: #0f7c86; }
.head-rs { fill: #fbece4; stroke: #b4501c; }
.grp-cpp { fill: #e3f3f4; fill-opacity: .45; stroke: #0f7c86; stroke-dasharray: 4 3; }
.grp-rs { fill: #fbece4; fill-opacity: .45; stroke: #b4501c; stroke-dasharray: 4 3; }
.box { fill: #ffffff; stroke: #1b2230; }
.diamond { fill: #ffffff; stroke: #1b2230; stroke-width: 2; }
.good { fill: #e5f3ea; stroke: #2f7d4a; }
.bad { fill: #f8e4e5; stroke: #b0303a; }</style>
<defs>
<marker id="rr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fill-fg"/></marker>
<marker id="rr-w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fill-rs"/></marker>
</defs>
<line x1="100" y1="56" x2="100" y2="548" class="life"/>
<line x1="260" y1="56" x2="260" y2="548" class="life"/>
<line x1="420" y1="56" x2="420" y2="548" class="life"/>
<line x1="580" y1="56" x2="580" y2="548" class="life"/>
<line x1="740" y1="56" x2="740" y2="548" class="life"/>
<line x1="900" y1="56" x2="900" y2="548" class="life"/>
<rect x="14" y="212" width="972" height="64" rx="5" class="grp-rs"/>
<rect x="14" y="212" width="71" height="18" rx="5" class="fill-rs"/>
<text x="22" y="225" text-anchor="start" font-size="11" font-weight="500" class="on-accent">pipe Full</text>
<rect x="14" y="288" width="972" height="64" rx="5" class="grp-rs"/>
<rect x="14" y="288" width="201" height="18" rx="5" class="fill-rs"/>
<text x="22" y="301" text-anchor="start" font-size="11" font-weight="500" class="on-accent">only if the socket was waiting</text>
<rect x="14" y="466" width="972" height="64" rx="5" class="grp-rs"/>
<rect x="14" y="466" width="330" height="18" rx="5" class="fill-rs"/>
<text x="22" y="479" text-anchor="start" font-size="11" font-weight="500" class="on-accent">later, once the socket drains to the low-water mark</text>
<rect x="65" y="16" width="70" height="40" rx="4" class="head-rs"/>
<text x="100" y="33" text-anchor="middle" font-size="12" font-family="IBM Plex Mono, ui-monospace, monospace" font-weight="500">Stream</text>
<text x="100" y="48" text-anchor="middle" font-size="10" class="muted">TCP / UDS</text>
<rect x="217" y="16" width="87" height="40" rx="4" class="head-rs"/>
<text x="260" y="33" text-anchor="middle" font-size="12" font-family="IBM Plex Mono, ui-monospace, monospace" font-weight="500">EventLoop</text>
<text x="260" y="48" text-anchor="middle" font-size="10" class="muted">mio, edge</text>
<rect x="376" y="16" width="87" height="40" rx="4" class="head-rs"/>
<text x="420" y="33" text-anchor="middle" font-size="12" font-family="IBM Plex Mono, ui-monospace, monospace" font-weight="500">Engine</text>
<text x="420" y="48" text-anchor="middle" font-size="10" class="muted">zmtp Decoder</text>
<rect x="528" y="16" width="104" height="40" rx="4" class="head-rs"/>
<text x="580" y="33" text-anchor="middle" font-size="12" font-family="IBM Plex Mono, ui-monospace, monospace" font-weight="500">pipe</text>
<text x="580" y="48" text-anchor="middle" font-size="10" class="muted">Writer → Reader</text>
<rect x="697" y="16" width="87" height="40" rx="4" class="head-rs"/>
<text x="740" y="33" text-anchor="middle" font-size="12" font-family="IBM Plex Mono, ui-monospace, monospace" font-weight="500">FairQueue</text>
<text x="740" y="48" text-anchor="middle" font-size="10" class="muted">socket.rs</text>
<rect x="865" y="16" width="70" height="40" rx="4" class="head-rs"/>
<text x="900" y="33" text-anchor="middle" font-size="12" font-family="IBM Plex Mono, ui-monospace, monospace" font-weight="500">app</text>
<text x="900" y="48" text-anchor="middle" font-size="10" class="muted">user code</text>
<line x1="103" y1="82" x2="257" y2="82" class="ln-fg" marker-end="url(#rr-a)"/>
<text x="110" y="76" text-anchor="start" font-size="12" class="lbl">readable (edge-triggered)</text>
<text x="90" y="86" text-anchor="end" font-size="10" font-family="IBM Plex Mono, ui-monospace, monospace" class="num">1</text>
<line x1="263" y1="116" x2="417" y2="116" class="ln-fg" marker-end="url(#rr-a)"/>
<text x="270" y="110" text-anchor="start" font-size="12" class="lbl">drive_session(id)</text>
<text x="250" y="120" text-anchor="end" font-size="10" font-family="IBM Plex Mono, ui-monospace, monospace" class="num">2</text>
<path d="M423,141 h18 v12 h-15" class="ln-fg" fill="none" marker-end="url(#rr-a)"/>
<text x="448" y="150" text-anchor="start" font-size="12" class="lbl">decode into BytesMut → whole Message</text>
<text x="410" y="151" text-anchor="end" font-size="10" font-family="IBM Plex Mono, ui-monospace, monospace" class="num">3</text>
<line x1="423" y1="184" x2="577" y2="184" class="ln-fg" marker-end="url(#rr-a)"/>
<text x="430" y="178" text-anchor="start" font-size="12" class="lbl">try_send(Message)</text>
<text x="410" y="188" text-anchor="end" font-size="10" font-family="IBM Plex Mono, ui-monospace, monospace" class="num">4</text>
<path d="M423,241 h18 v12 h-15" class="ln-fg" fill="none" marker-end="url(#rr-a)"/>
<text x="448" y="250" text-anchor="start" font-size="12" class="lbl">keep the message, stop reading</text>
<text x="410" y="251" text-anchor="end" font-size="10" font-family="IBM Plex Mono, ui-monospace, monospace" class="num">5</text>
<line x1="583" y1="326" x2="897" y2="326" class="ln-rs dash" marker-end="url(#rr-w)"/>
<text x="590" y="320" text-anchor="start" font-size="12" class="lbl t-rs">wake: thread unpark or task waker</text>
<text x="570" y="330" text-anchor="end" font-size="10" font-family="IBM Plex Mono, ui-monospace, monospace" class="num">6</text>
<line x1="897" y1="370" x2="743" y2="370" class="ln-fg" marker-end="url(#rr-a)"/>
<text x="750" y="364" text-anchor="start" font-size="12" class="lbl">recv()</text>
<text x="910" y="374" text-anchor="start" font-size="10" font-family="IBM Plex Mono, ui-monospace, monospace" class="num">7</text>
<line x1="737" y1="404" x2="583" y2="404" class="ln-fg" marker-end="url(#rr-a)"/>
<text x="590" y="398" text-anchor="start" font-size="12" class="lbl">poll_recv, round robin</text>
<text x="750" y="408" text-anchor="start" font-size="10" font-family="IBM Plex Mono, ui-monospace, monospace" class="num">8</text>
<line x1="743" y1="438" x2="897" y2="438" class="ln-fg" marker-end="url(#rr-a)"/>
<text x="750" y="432" text-anchor="start" font-size="12" class="lbl">whole Message</text>
<text x="730" y="442" text-anchor="end" font-size="10" font-family="IBM Plex Mono, ui-monospace, monospace" class="num">9</text>
<line x1="577" y1="504" x2="263" y2="504" class="ln-rs dash" marker-end="url(#rr-w)"/>
<text x="270" y="498" text-anchor="start" font-size="12" class="lbl t-rs">writer waker → TokenWaker: resume reading</text>
<text x="590" y="508" text-anchor="start" font-size="10" font-family="IBM Plex Mono, ui-monospace, monospace" class="num">10</text>
</svg>
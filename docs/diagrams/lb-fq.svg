<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="Load balancer sends to the next peer with room, skipping full ones; fair queue takes the next message round robin from peers that have one." font-family="IBM Plex Sans, system-ui, sans-serif"><rect width="100%" height="100%" fill="#ffffff"/><style>text{fill:#1b2230}
text { fill: #1b2230; }
.muted, .num { fill: #5a6476; }
.lbl { paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
.t-cpp { fill: #0f7c86; } .t-rs { fill: #b4501c; }
.on-accent { fill: #ffffff; }
.fill-fg { fill: #1b2230; } .fill-cpp { fill: #0f7c86; } .fill-rs { fill: #b4501c; }
.ln-fg { stroke: #1b2230; stroke-width: 1.4; fill: none; }
.ln-cpp { stroke: #0f7c86; stroke-width: 1.6; } .ln-rs { stroke: #b4501c; stroke-width: 1.6; }
.dash { stroke-dasharray: 5 4; }
.life { stroke: #d9dee6; stroke-width: 1.2; stroke-dasharray: 3 4; }
.head-cpp { fill: #e3f3f4; stroke: #0f7c86; }
.head-rs { fill: #fbece4; stroke: #b4501c; }
.grp-cpp { fill: #e3f3f4; fill-opacity: .45; stroke: #0f7c86; stroke-dasharray: 4 3; }
.grp-rs { fill: #fbece4; fill-opacity: .45; stroke: #b4501c; stroke-dasharray: 4 3; }
.box { fill: #ffffff; stroke: #1b2230; }
.diamond { fill: #ffffff; stroke: #1b2230; stroke-width: 2; }
.good { fill: #e5f3ea; stroke: #2f7d4a; }
.bad { fill: #f8e4e5; stroke: #b0303a; }</style>
<defs>
<marker id="lb-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fill-fg"/></marker>
<marker id="lb-w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fill-rs"/></marker>
</defs>
<text x="20" y="22" text-anchor="start" font-size="13" font-weight="600">Outbound: LoadBalancer / lb_t</text>
<rect x="20" y="110" width="170" height="60" rx="4" class="head-rs"/>
<text x="105" y="136" text-anchor="middle" font-size="12" font-family="IBM Plex Mono, ui-monospace, monospace">LoadBalancer</text>
<text x="105" y="152" text-anchor="middle" font-size="12" font-family="IBM Plex Mono, ui-monospace, monospace">next = 1</text>
<rect x="330" y="44" width="140" height="52" rx="4" class="box"/>
<text x="400" y="66" text-anchor="middle" font-size="12">peer 0</text>
<text x="400" y="82" text-anchor="middle" font-size="12">room</text>
<rect x="330" y="118" width="140" height="52" rx="4" class="bad"/>
<text x="400" y="140" text-anchor="middle" font-size="12">peer 1</text>
<text x="400" y="156" text-anchor="middle" font-size="12">full (HWM)</text>
<rect x="330" y="192" width="140" height="52" rx="4" class="good"/>
<text x="400" y="214" text-anchor="middle" font-size="12">peer 2</text>
<text x="400" y="230" text-anchor="middle" font-size="12">room</text>
<line x1="192" y1="132" x2="326" y2="144" class="ln-fg dash" marker-end="url(#lb-a)"/>
<text x="200" y="122" text-anchor="start" font-size="11" class="lbl">1. peer 1 full: register cx</text>
<line x1="192" y1="152" x2="326" y2="218" class="ln-fg" marker-end="url(#lb-a)"/>
<text x="318" y="242" text-anchor="end" font-size="11" class="lbl">2. send to peer 2, next = 0</text>
<text x="20" y="270" text-anchor="start" font-size="11" class="muted">Starts at next, skips full and closed peers.</text>
<text x="20" y="286" text-anchor="start" font-size="11" class="muted">If none has room: hand message back, wait.</text>
<line x1="505" y1="10" x2="505" y2="290" class="life"/>
<text x="530" y="22" text-anchor="start" font-size="13" font-weight="600">Inbound: FairQueue / fq_t</text>
<rect x="530" y="44" width="140" height="52" rx="4" class="box"/>
<text x="600" y="66" text-anchor="middle" font-size="12">peer 0</text>
<text x="600" y="82" text-anchor="middle" font-size="12">empty</text>
<rect x="530" y="118" width="140" height="52" rx="4" class="good"/>
<text x="600" y="140" text-anchor="middle" font-size="12">peer 1</text>
<text x="600" y="156" text-anchor="middle" font-size="12">2 waiting</text>
<rect x="530" y="192" width="140" height="52" rx="4" class="bad"/>
<text x="600" y="214" text-anchor="middle" font-size="12">peer 2</text>
<text x="600" y="230" text-anchor="middle" font-size="12">closed, drained</text>
<rect x="810" y="110" width="170" height="60" rx="4" class="head-rs"/>
<text x="895" y="136" text-anchor="middle" font-size="12" font-family="IBM Plex Mono, ui-monospace, monospace">FairQueue</text>
<text x="895" y="152" text-anchor="middle" font-size="12" font-family="IBM Plex Mono, ui-monospace, monospace">next = 2</text>
<line x1="672" y1="70" x2="806" y2="128" class="ln-fg dash" marker-end="url(#lb-a)"/>
<text x="690" y="64" text-anchor="start" font-size="11" class="lbl">Pending</text>
<line x1="672" y1="144" x2="806" y2="140" class="ln-fg" marker-end="url(#lb-a)"/>
<text x="690" y="134" text-anchor="start" font-size="11" class="lbl">1 message</text>
<line x1="672" y1="218" x2="806" y2="152" class="ln-fg dash" marker-end="url(#lb-a)"/>
<text x="690" y="232" text-anchor="start" font-size="11" class="lbl">removed</text>
<text x="530" y="270" text-anchor="start" font-size="11" class="muted">Round robin over peers with a message.</text>
<text x="530" y="286" text-anchor="start" font-size="11" class="muted">Drops a peer once closed and fully read.</text>
</svg>
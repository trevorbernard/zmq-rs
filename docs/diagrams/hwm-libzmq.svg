<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="358" viewBox="0 0 1000 358" role="img" aria-label="libzmq HWM: the reader sends an activate_write command every low-water mark messages; the writer sees it only when its thread processes commands." font-family="IBM Plex Sans, system-ui, sans-serif"><rect width="100%" height="100%" fill="#ffffff"/><style>text{fill:#1b2230}
text { fill: #1b2230; }
.muted, .num { fill: #5a6476; }
.lbl { paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
.t-cpp { fill: #0f7c86; } .t-rs { fill: #b4501c; }
.on-accent { fill: #ffffff; }
.fill-fg { fill: #1b2230; } .fill-cpp { fill: #0f7c86; } .fill-rs { fill: #b4501c; }
.ln-fg { stroke: #1b2230; stroke-width: 1.4; fill: none; }
.ln-cpp { stroke: #0f7c86; stroke-width: 1.6; } .ln-rs { stroke: #b4501c; stroke-width: 1.6; }
.dash { stroke-dasharray: 5 4; }
.life { stroke: #d9dee6; stroke-width: 1.2; stroke-dasharray: 3 4; }
.head-cpp { fill: #e3f3f4; stroke: #0f7c86; }
.head-rs { fill: #fbece4; stroke: #b4501c; }
.grp-cpp { fill: #e3f3f4; fill-opacity: .45; stroke: #0f7c86; stroke-dasharray: 4 3; }
.grp-rs { fill: #fbece4; fill-opacity: .45; stroke: #b4501c; stroke-dasharray: 4 3; }
.box { fill: #ffffff; stroke: #1b2230; }
.diamond { fill: #ffffff; stroke: #1b2230; stroke-width: 2; }
.good { fill: #e5f3ea; stroke: #2f7d4a; }
.bad { fill: #f8e4e5; stroke: #b0303a; }</style>
<defs>
<marker id="hc-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fill-fg"/></marker>
<marker id="hc-w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fill-cpp"/></marker>
</defs>
<line x1="140" y1="56" x2="140" y2="354" class="life"/>

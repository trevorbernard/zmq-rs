<text x="150" y="212" text-anchor="start" font-size="12" class="lbl t-cpp">activate_write(msgs_read) via socket mailbox</text>
<text x="630" y="222" text-anchor="start" font-size="10" font-family="IBM Plex Mono, ui-monospace, monospace" class="num">5</text>
<path d="M143,243 h18 v12 h-15" class="ln-fg" fill="none" marker-end="url(#hc-a)"/>
<text x="168" y="252" text-anchor="start" font-size="12" class="lbl">next send/recv: process_commands</text>
<text x="130" y="253" text-anchor="end" font-size="10" font-family="IBM Plex Mono, ui-monospace, monospace" class="num">6</text>
<line x1="143" y1="286" x2="377" y2="286" class="ln-fg" marker-end="url(#hc-a)"/>
<text x="150" y="280" text-anchor="start" font-size="12" class="lbl">peers_msgs_read = n</text>

<text x="408" y="116" text-anchor="start" font-size="12" class="lbl">out_active = false, lb_t skips it</text>
<text x="370" y="117" text-anchor="end" font-size="10" font-family="IBM Plex Mono, ui-monospace, monospace" class="num">2</text>

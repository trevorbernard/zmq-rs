<text x="620" y="33" text-anchor="middle" font-size="12" font-family="IBM Plex Mono, ui-monospace, monospace" font-weight="500">pipe_t</text>
<text x="620" y="48" text-anchor="middle" font-size="10" class="muted">reader end</text>

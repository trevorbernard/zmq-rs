<text x="648" y="184" text-anchor="start" font-size="12" class="lbl">msgs_read % lwm == 0</text>
<text x="610" y="185" text-anchor="end" font-size="10" font-family="IBM Plex Mono, ui-monospace, monospace" class="num">4</text>

<line x1="777" y1="430" x2="908" y2="430" class="ln-fg" marker-end="url(#rc-a)"/>
<text x="784" y="424" text-anchor="start" font-size="12" class="lbl">frame 1 + RCVMORE, app loops</text>
<text x="764" y="434" text-anchor="end" font-size="10" font-family="IBM Plex Mono, ui-monospace, monospace" class="num">10</text>
</svg>
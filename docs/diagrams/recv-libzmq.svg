<rect x="605" y="16" width="65" height="40" rx="4" class="head-cpp"/>
<text x="637" y="33" text-anchor="middle" font-size="12" font-family="IBM Plex Mono, ui-monospace, monospace" font-weight="500">pipe_t</text>
<text x="637" y="48" text-anchor="middle" font-size="10" class="muted">ypipe</text>

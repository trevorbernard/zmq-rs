<text x="627" y="288" text-anchor="end" font-size="10" font-family="IBM Plex Mono, ui-monospace, monospace" class="num">6</text>
<line x1="908" y1="328" x2="777" y2="328" class="ln-fg" marker-end="url(#rc-a)"/>
<text x="784" y="322" text-anchor="start" font-size="12" class="lbl">zmq_msg_recv</text>
<text x="921" y="332" text-anchor="start" font-size="10" font-family="IBM Plex Mono, ui-monospace, monospace" class="num">7</text>
<path d="M777,353 h18 v12 h-15" class="ln-fg" fill="none" marker-end="url(#rc-a)"/>
<text x="764" y="362" text-anchor="end" font-size="12" class="lbl">process_commands: fq_t activates pipe</text>
<text x="802" y="363" text-anchor="start" font-size="10" font-family="IBM Plex Mono, ui-monospace, monospace" class="num">8</text>
<line x1="771" y1="396" x2="640" y2="396" class="ln-fg" marker-end="url(#rc-a)"/>
<text x="647" y="390" text-anchor="start" font-size="12" class="lbl">read one frame</text>

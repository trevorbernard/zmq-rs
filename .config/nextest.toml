[test-groups]
# `free_port` in tests/interop/tests/core.rs counts up from a fixed port
# within one process; nextest runs each test in its own, so they collide.
interop-core = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'package(zmq-interop) & binary(core)'
test-group = 'interop-core'

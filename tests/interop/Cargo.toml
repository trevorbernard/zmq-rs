[package]
name = "zmq-interop"
description = "Interoperability tests against the reference libzmq"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Interop tests for the draft socket types.
draft = ["zmq/draft"]

[dependencies]
zmq = { path = "../../crates/zmq" }
zmq-core.workspace = true
zmq-pipe.workspace = true
zmtp.workspace = true

[build-dependencies]
pkg-config = "0.3"

[lints]
workspace = true

[[bench]]
name = "perf"
harness = false

[[bench]]
name = "scenarios"
harness = false

name: CI

on:
  push:
    branches: ['**']
    tags-ignore: ['**']
  pull_request:

jobs:
  ci:
    name: CI
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      # The dev shell, as locally: the toolchain, nextest, a libzmq with
      # drafts and the legacy peers, all pinned by flake.lock. It sets
      # ZMQ_INTEROP_STRICT, so an interop test fails rather than skips.
      - name: Install Nix
        # v35
        uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c

      - name: Cache Nix store
        # v7.0.2
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock', 'nix/**', 'tests/interop/legacy/**', 'rust-toolchain.toml') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 3G

      # Swatinem/rust-cache needs cargo outside the dev shell.
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Format
        run: nix develop -c just fmt-check

      - name: Clippy
        run: nix develop -c just clippy

      - name: Test
        run: nix develop -c just test

      - name: Loom
        run: nix develop -c just loom

  nightly:
    name: Miri and ThreadSanitizer
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Over the repository's rust-toolchain.toml: Miri and the sanitizers
    # need nightly.
    env:
      RUSTUP_TOOLCHAIN: nightly

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: nightly
          components: miri, rust-src

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Miri
        run: cargo miri test -p zmq-pipe --lib

      # As `just tsan`, without the dev shell.
      - name: ThreadSanitizer
        env:
          RUSTFLAGS: -Zsanitizer=thread
          CARGO_TARGET_DIR: target/tsan
        run: |
          tsan="cargo test -Zbuild-std --target x86_64-unknown-linux-gnu"
          $tsan -p zmq-pipe --lib --tests
          $tsan -p zmq --all-features --test shutdown_stress
          $tsan -p zmq --all-features --test libzmq shutdown_stress

  fuzz:
    name: Fuzz
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Over the repository's rust-toolchain.toml, which rustup would
    # otherwise pick inside fuzz/: cargo-fuzz needs nightly.
    env:
      RUSTUP_TOOLCHAIN: nightly

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: nightly

      - name: Install cargo-fuzz
        # v2.87.27
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe
        with:
          tool: cargo-fuzz

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz

      - name: Seed
        run: fuzz/seed.sh

      - name: Fuzz every target for 30 seconds
        run: fuzz/run-all.sh 30

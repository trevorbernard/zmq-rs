name: CI

on:
  push:
    branches: ['**']
    tags-ignore: ['**']
  pull_request:

jobs:
  ci:
    name: CI
    # Pinned so the libzmq the interop tests run against changes only on
    # purpose.
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - name: Install libzmq for interop tests
        run: sudo apt-get update && sudo apt-get install -y libzmq3-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: '1.99.1'
          components: clippy, rustfmt

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Install nextest
        # v2.87.27
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe
        with:
          tool: nextest

      - name: Test
        run: cargo nextest run --workspace --all-features

      # nextest does not run doctests.
      - name: Doctests
        run: cargo test --workspace --all-features --doc

  fuzz:
    name: Fuzz
    runs-on: ubuntu-24.04
    # Over the repository's rust-toolchain.toml, which rustup would
    # otherwise pick inside fuzz/: cargo-fuzz needs nightly.
    env:
      RUSTUP_TOOLCHAIN: nightly

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: nightly

      - name: Install cargo-fuzz
        # v2.87.27
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe
        with:
          tool: cargo-fuzz

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz

      - name: Seed
        run: fuzz/seed.sh

      - name: Fuzz every target for 30 seconds
        run: fuzz/run-all.sh 30

[workspace]
resolver = "3"
members = ["crates/*", "examples", "tests/interop"]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.99"
license = "MPL-2.0"
repository = "https://github.com/trevorbernard/zmq-rs"
publish = false

[workspace.dependencies]
atomic-waker = "1"
bytes = "1"
criterion = "0.8"
# `std` for detecting AVX2 and AVX-512 at run time; without it only the
# features the build targets are used.
dryoc = { version = "2", default-features = false, features = ["std"] }
if-addrs = "0.15"
libc = "0.2"
loom = "0.7"
mio = { version = "1", features = ["net", "os-ext", "os-poll"] }
proptest = { version = "1", default-features = false, features = ["std"] }
# `all` for the TCP keepalive probe count.
socket2 = { version = "0.6", features = ["all"] }
zeroize = "1"
zmtp = { path = "crates/zmtp" }
zmq-pipe = { path = "crates/zmq-pipe" }
zmq-core = { path = "crates/zmq-core" }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
# `zmq-pipe`'s queue on loom's atomics, for its model tests.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"

# For `just mutants`: unoptimized for quick rebuilds, without debug info
# for quick links, but optimizing what the property tests spend their time
# in, which runs them forty times faster.
[profile.mutants]
inherits = "dev"
debug = false

[profile.mutants.package.zmtp]
opt-level = 3

[profile.mutants.package.proptest]
opt-level = 3

[profile.mutants.package.dryoc]
opt-level = 3

[workspace]
resolver = "3"
members = ["crates/*", "examples", "tests/interop"]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.94"
license = "MPL-2.0"
repository = "https://github.com/trevorbernard/zmq-rs"
publish = false

[workspace.dependencies]
atomic-waker = "1"
bytes = "1"
criterion = "0.8"
crypto_box = "0.9"
crypto_secretbox = "0.1"
# `std` for detecting AVX2 and AVX-512 at run time; without it only the
# features the build targets are used.
dryoc = { version = "2", default-features = false, features = ["std"] }
mio = { version = "1", features = ["net", "os-poll"] }
proptest = { version = "1", default-features = false, features = ["std"] }
zeroize = "1"
zmtp = { path = "crates/zmtp" }
zmq-pipe = { path = "crates/zmq-pipe" }
zmq-core = { path = "crates/zmq-core" }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
